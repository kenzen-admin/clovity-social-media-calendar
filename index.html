<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clovity Social Media Calendar - August–September 2026</title>
<style>
  :root{
    --branding:#2563eb;      --branding-soft:#eaf1ff;
    --ai:#7c3aed;
    --apps:#0d9488;
    --product:#ea580c;
    --public:#16a34a;
    --ink:#1f2430;
    --ink-soft:#5b6270;
    --muted:#8a8f9c;
    --line:#e7e5e1;
    --bg:#f8f6f2;
    --card:#ffffff;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:9px;
    --shadow-sm:0 1px 3px rgba(31,36,48,.07);
    --shadow-md:0 6px 20px rgba(31,36,48,.09), 0 1px 3px rgba(31,36,48,.06);
    --shadow-lg:0 18px 40px rgba(31,36,48,.14);
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;
    position:relative;
    min-height:100vh;
  }
  h1,h2,h3,h4{margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  a{color:inherit;}

  /* ---------- decorative botanical background ---------- */
  .decor{
    position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  }
  .decor svg{position:absolute;opacity:.55;}
  .decor .d-tl{top:-40px;left:-50px;width:280px;}
  .decor .d-tr{top:-30px;right:-60px;width:300px;transform:scaleX(-1);}
  .decor .d-bl{bottom:-50px;left:-40px;width:260px;transform:scaleY(-1);}
  .decor .d-br{bottom:-40px;right:-50px;width:290px;transform:scale(-1,-1);}
  @media (max-width:1150px){ .decor{display:none;} }

  .page-shell{
    position:relative;z-index:1;
    max-width:1280px;margin:0 auto;
    padding:32px 28px 64px;
    background:linear-gradient(180deg,var(--bg) 0%, var(--bg) 100%);
  }

  /* ---------- header ---------- */
  .page-header{
    background:var(--card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow-md);
    padding:28px 30px 22px;
    margin-bottom:24px;
  }
  .logo-lockup{
    flex:0 0 auto;
  }
  .logo-lockup img{width:180px;max-width:100%;height:auto;display:block;}
  .brand-row{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;text-align:left;
  }
  .title-block h1{
    font-size:1.7rem;font-weight:700;letter-spacing:.2px;color:var(--ink);
  }
  .date-range{
    margin:4px 0 0;font-size:1.05rem;font-weight:600;color:var(--ink-soft);
  }
  .controls-row{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    margin-top:20px;padding-top:18px;border-top:1px solid var(--line);
  }
  .btn{
    display:inline-flex;align-items:center;gap:6px;
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 14px;border-radius:10px;font-size:.88rem;font-weight:600;
    box-shadow:var(--shadow-sm);transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .btn:active{transform:translateY(0);}
  .btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none;}
  .btn-primary{background:var(--branding);border-color:var(--branding);color:#fff;}
  .btn-primary:hover{background:#1d4fd1;}
  .btn-sm{padding:6px 10px;font-size:.78rem;border-radius:8px;}
  select.month-select{
    border:1px solid var(--line);background:#fff;color:var(--ink);
    padding:9px 12px;border-radius:10px;font-size:.88rem;font-weight:600;box-shadow:var(--shadow-sm);
  }
  .spacer{flex:1 1 auto;}

  .legend{
    display:flex;flex-wrap:wrap;gap:14px 22px;list-style:none;margin:18px 0 0;padding:0;
  }
  .legend li{display:flex;align-items:center;gap:8px;font-size:.85rem;color:var(--ink-soft);font-weight:600;}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:0 0 auto;}
  .dot-branding{background:var(--branding);}
  .dot-ai{background:var(--ai);}
  .dot-apps{background:var(--apps);}
  .dot-product{background:var(--product);}
  .dot-public{background:var(--public);}

  /* ---------- filter bar ---------- */
  .filter-bar{
    display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow-sm);
    padding:14px 16px;margin-bottom:24px;
  }
  .filter-bar label{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;display:block;margin-bottom:3px;}
  .filter-field{display:flex;flex-direction:column;}
  .filter-bar select, .filter-bar input[type="search"]{
    border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:.85rem;background:#fff;color:var(--ink);min-width:140px;
  }
  .filter-bar input[type="search"]{min-width:200px;}
  .filter-actions{display:flex;gap:8px;margin-left:auto;align-self:flex-end;}

  .empty-note{color:var(--muted);font-size:.85rem;font-style:italic;}

  /* ---------- week at a glance ---------- */
  .week-glance{margin-bottom:24px;}
  .week-glance h2{font-size:1.15rem;margin-bottom:14px;padding-left:2px;}
  .glance-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  @media (max-width:900px){.glance-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:560px){.glance-grid{grid-template-columns:1fr;}}
  .glance-card{
    border-radius:var(--radius-md);padding:16px 16px 14px;box-shadow:var(--shadow-sm);
    border:1px solid var(--line);background:var(--card);border-top:5px solid var(--cat-color, var(--branding));
  }
  .glance-card .glance-day{font-size:.75rem;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;}
  .glance-card .glance-cat{font-size:1.05rem;font-weight:800;margin:2px 0 6px;color:var(--cat-color);}
  .glance-card p{font-size:.83rem;color:var(--ink-soft);margin:0;}

  /* ---------- strategy section ---------- */
  .strategy-section{
    margin-bottom:24px;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
    padding:24px 26px;
  }
  .strategy-section.collapsed{display:none;}
  .strategy-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .strategy-head h2{font-size:1.2rem;}
  .strategy-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;}
  @media (max-width:1050px){.strategy-grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:600px){.strategy-grid{grid-template-columns:1fr;}}
  .strategy-card{
    border-radius:var(--radius-md);padding:18px 16px;background:var(--cat-soft, var(--branding-soft));
    border:1px solid var(--line);
  }
  .strategy-card .s-day{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;font-weight:800;color:var(--cat-color);}
  .strategy-card h3{font-size:1.05rem;margin:4px 0 10px;color:var(--ink);}
  .strategy-card ul{margin:0;padding-left:18px;font-size:.82rem;color:var(--ink-soft);}
  .strategy-card li{margin-bottom:5px;}

  /* ---------- calendar ---------- */
  .calendar-section{
    background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);
    padding:26px 28px 30px;
  }
  .calendar-head{text-align:center;margin-bottom:22px;}
  .month-heading{
    font-family:"Segoe Script","Brush Script MT","Lucida Handwriting",cursive;
    font-size:3rem;color:var(--branding);letter-spacing:.5px;font-weight:400;
  }
  .calendar-grid-wrapper{overflow-x:auto;padding-bottom:6px;}
  .weekday-header-row{
    display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:16px;margin-bottom:12px;min-width:1040px;
  }
  .weekday-header{
    text-align:center;padding:8px 0;border-radius:10px 10px 0 0;
    font-weight:800;font-size:.85rem;text-transform:uppercase;letter-spacing:.6px;color:#fff;
    background:var(--cat-color);
  }
  .week-row{
    display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:16px;margin-bottom:16px;min-width:1040px;
  }
  .day-cell{
    border-radius:var(--radius-md);border:1px solid var(--line);background:var(--cat-soft);
    padding:12px 12px 14px;min-height:150px;display:flex;flex-direction:column;gap:8px;
  }
  .day-cell.empty-cell{background:repeating-linear-gradient(135deg, rgba(0,0,0,.02) 0 10px, transparent 10px 20px);border:1px dashed var(--line);}
  .day-cell-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .day-number{font-size:1.3rem;font-weight:800;color:var(--ink);}
  .weekday-chip{
    display:inline-flex;align-items:center;justify-content:center;text-align:center;
    font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--cat-color);
    background:#fff;border:1px solid var(--cat-color);border-radius:20px;padding:2px 8px;
  }
  .day-posts{display:flex;flex-direction:column;gap:8px;}
  .post-card{
    background:#fff;border-radius:var(--radius-sm);border:1px solid var(--line);box-shadow:var(--shadow-sm);
    padding:10px 11px;
  }
  .post-card-top{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px;}
  .badge{
    display:inline-flex;align-items:center;gap:4px;font-size:.65rem;font-weight:700;
    padding:2px 7px;border-radius:20px;white-space:nowrap;
  }
  .type-badge{background:#eef0f4;color:#4a5061;border:1px solid #dcdfe6;}
  .status-badge{color:#fff;}
  .status-placeholder{background:#9ca3af;}
  .status-idea{background:#38bdf8;}
  .status-drafting{background:#f59e0b;}
  .status-in-review{background:#fb923c;}
  .status-approved{background:#14b8a6;}
  .status-scheduled{background:#6366f1;}
  .status-published{background:#22c55e;}
  .post-title{font-size:.87rem;font-weight:700;color:var(--ink);margin:0 0 3px;}
  .post-desc{font-size:.76rem;color:var(--ink-soft);margin:0 0 4px;}
  .post-card-actions{display:flex;align-items:center;margin-top:4px;gap:6px;}
  .collateral-btn{
    display:inline-flex;align-items:center;gap:5px;margin-left:auto;
    font-size:.72rem;font-weight:700;color:var(--cat-color, var(--branding));text-decoration:none;
    background:var(--cat-soft, var(--branding-soft));border:1px solid var(--cat-color, var(--branding));
    border-radius:20px;padding:4px 10px;white-space:nowrap;
  }
  .collateral-btn:hover{background:var(--cat-color, var(--branding));color:#fff;}
  .collateral-btn.is-disabled{
    color:var(--muted);background:var(--bg);border-color:var(--line);
    cursor:not-allowed;pointer-events:none;
  }
  .empty-note-cell{font-size:.75rem;color:var(--muted);font-style:italic;margin:2px 0 0;}

  /* status bar */
  #statusMessage{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:.85rem;font-weight:600;
    box-shadow:var(--shadow-lg);z-index:500;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;
  }
  #statusMessage.show{opacity:1;transform:translateX(-50%) translateY(-4px);}

  /* ---------- print ---------- */
  @media print{
    .no-print, .controls-row, .filter-bar, .decor, .strategy-head .btn { display:none !important; }
    body{background:#fff;}
    .page-shell{padding:0;max-width:100%;}
    .page-header, .week-glance, .strategy-section, .calendar-section{box-shadow:none;border:1px solid #ddd;}
    .strategy-section.collapsed{display:block !important;}
    .calendar-grid-wrapper{overflow:visible;}
    .weekday-header-row, .week-row{min-width:0;}
    .day-cell, .post-card{break-inside:avoid;page-break-inside:avoid;}
    @page{size:landscape;margin:10mm;}
  }

  /* ---------- mobile agenda ---------- */
  @media (max-width:700px){
    .page-shell{padding:18px 14px 48px;}
    .brand-row{gap:12px;}
    .month-heading{font-size:2.2rem;}
    .weekday-header-row{display:none;}
    .calendar-grid-wrapper{overflow-x:visible;}
    .week-row{display:block;min-width:0;}
    .day-cell{margin-bottom:14px;min-height:0;}
    .day-cell.empty-cell{display:none;}
    .filter-actions{margin-left:0;width:100%;justify-content:flex-end;}
  }
</style>
</head>

  var TYPE_OPTIONS = ["Static","Carousel","Video","GIF","Blog","Photo","Webinar","Newsletter","Case Study","Announcement"];
  var STATUS_OPTIONS = ["Placeholder","Idea","Drafting","In Review","Approved","Scheduled","Published"];
  var TYPE_ICON = {Static:"&#9679;",Carousel:"&#9638;",Video:"&#9654;",GIF:"&#9689;",Blog:"&#9998;",Photo:"&#9635;",Webinar:"&#9674;",Newsletter:"&#9993;",Announcement:"!","Case Study":"&#9670;"};

  var DOW_INFO = [
    {name:"Monday",    category:"Branding",       colorHex:"#2563eb", soft:"#eaf1ff"},
    {name:"Tuesday",   category:"AI",              colorHex:"#7c3aed", soft:"#f3edff"},
    {name:"Wednesday", category:"Apps",            colorHex:"#0d9488", soft:"#e6f7f4"},
    {name:"Thursday",  category:"Product Series",  colorHex:"#ea580c", soft:"#fef1e8"},
    {name:"Friday",    category:"Public Sector",   colorHex:"#16a34a", soft:"#eafaf0"}
  ];

  var STRATEGY_CONTENT = [
    { day:"Monday", cat:"Branding", tagline:"Branding + flexible content", themes:["Event highlights, ACE events & roadshows","Webinars & solution videos","Team '26 experience recaps","Case studies & customer wins","Newsletters & blog posts","Community highlights & announcements"] },
    { day:"Tuesday", cat:"AI", tagline:"AI only", themes:["AI + Atlassian introductions & overviews","Atlassian Rovo, Rovo Search & Chat","Clovity Pulse AI spotlights & use cases","AI agents within Pulse","Agentic workflows","AI-powered Atlassian administration"] },
    { day:"Wednesday", cat:"Apps", tagline:"Apps only", themes:["Marketplace app spotlights","Dashboard templates & reports","Time tracking & resource planning","Reports, charts, templates & CQL export","Content formatting macros","LaTeX formulas & diagrams","Flow: Overview → Problem/Solution → Use Case → Key Features → Competitive Advantage"] },
    { day:"Thursday", cat:"Product Series", tagline:"Product series", themes:["Product explainer videos, PMC-style series","Jira & Confluence deep dives","Broad overview to niche feature education","Workflows & automation","Reporting, administration & governance","Team collaboration"] },
    { day:"Friday", cat:"Public Sector", tagline:"Public sector", themes:["Atlassian GovCloud, compliance & security","Public-sector, education & government use cases","FedRAMP & data residency","Legacy system migration","Public-sector customer wins","Approved marketplace apps & roadmap"] }
  ];

  var MONTHS = [
    {key:"2026-08", year:2026, month:8, label:"August 2026"},
    {key:"2026-09", year:2026, month:9, label:"September 2026"}
  ];

  /* =====================================================================
     STATE
     ===================================================================== */
  var posts = DEFAULT_POSTS;
  var state = {
    monthKey: "2026-08",
    filters: { category:"", type:"", status:"", search:"" }
  };

  function pad(n){ return String(n).length < 2 ? "0"+n : String(n); }

  function escapeHtml(str){
    return String(str==null?"":str).replace(/[&<>"']/g, function(ch){
      return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"})[ch];
    });
  }
  function slugStatus(s){ return String(s).toLowerCase().replace(/\s+/g,"-"); }

  function isValidUrl(url){
    if(!url) return true;
    try{
      var u = new URL(url);
      return u.protocol === "http:" || u.protocol === "https:";
    }catch(e){ return false; }
  }

  function findMonth(key){
    for(var i=0;i<MONTHS.length;i++){ if(MONTHS[i].key===key) return MONTHS[i]; }
    return MONTHS[0];
  }

  /* =====================================================================
     CALENDAR GRID BUILD
     ===================================================================== */
  function buildWeeks(year, month){
    var daysInMonth = new Date(year, month, 0).getDate();
    var order = [];
    var map = {};
    for(var day=1; day<=daysInMonth; day++){
      var d = new Date(year, month-1, day);
      var dow = d.getDay();
      if(dow===0 || dow===6) continue;
      var mondayOffset = dow - 1;
      var monday = new Date(year, month-1, day - mondayOffset);
      var key = monday.getFullYear() + "-" + pad(monday.getMonth()+1) + "-" + pad(monday.getDate());
      if(!map[key]){ map[key] = new Array(5).fill(null); order.push(key); }
      map[key][dow-1] = { day:day, dateStr: year + "-" + pad(month) + "-" + pad(day) };
    }
    return order.map(function(k){ return map[k]; });
  }

  /* =====================================================================
     FILTERING
     ===================================================================== */
  function matchesFilters(post){
    var f = state.filters;
    if(f.category && post.category !== f.category) return false;
    if(f.type && post.postType !== f.type) return false;
    if(f.status && post.status !== f.status) return false;
    if(f.search){
      var hay = [post.title, post.description, post.campaign, post.owner, post.notes].join(" ").toLowerCase();
      if(hay.indexOf(f.search.toLowerCase()) === -1) return false;
    }
    return true;
  }

  /* =====================================================================
     RENDERING
     ===================================================================== */
  var el = {};
  function cacheEls(){
    ["prevMonthBtn","nextMonthBtn","todayBtn","monthSelectHeader","strategyBtn","printBtn",
     "filterMonth","filterCategory","filterType","filterStatus","searchInput","clearFiltersBtn",
     "glanceGrid","strategyGrid","strategySection","strategyCollapseBtn",
     "monthHeading","weekdayHeaderRow","calendarGrid","statusMessage"
    ].forEach(function(id){ el[id] = document.getElementById(id); });
  }

  function renderWeekdayHeader(){
    el.weekdayHeaderRow.innerHTML = DOW_INFO.map(function(info){
      return '<div class="weekday-header" style="--cat-color:'+info.colorHex+'">'+info.name+' &middot; '+info.category+'</div>';
    }).join("");
  }

  function renderGlance(){
    el.glanceGrid.innerHTML = STRATEGY_CONTENT.map(function(s, idx){
      var color = DOW_INFO[idx].colorHex;
      return '<div class="glance-card" style="--cat-color:'+color+'">'+
        '<div class="glance-day">'+escapeHtml(s.day)+'</div>'+
        '<div class="glance-cat">'+escapeHtml(s.cat)+'</div>'+
        '<p>'+escapeHtml(s.tagline)+'</p>'+
      '</div>';
    }).join("");
  }

  function renderStrategy(){
    el.strategyGrid.innerHTML = STRATEGY_CONTENT.map(function(s, idx){
      var info = DOW_INFO[idx];
      return '<div class="strategy-card" style="--cat-color:'+info.colorHex+';--cat-soft:'+info.soft+'">'+
        '<div class="s-day">'+escapeHtml(s.day)+'</div>'+
        '<h3>'+escapeHtml(s.cat)+'</h3>'+
        '<ul>'+ s.themes.map(function(t){ return '<li>'+escapeHtml(t)+'</li>'; }).join("") +'</ul>'+
      '</div>';
    }).join("");
  }

  function renderPostCard(post){
    var icon = TYPE_ICON[post.postType] || "&#9679;";
    var collateralBtn;
    if(post.url && isValidUrl(post.url)){
      collateralBtn = '<a class="collateral-btn" href="'+escapeHtml(post.url)+'" target="_blank" rel="noopener noreferrer" '+
        'aria-label="View collateral for '+escapeHtml(post.title)+' (opens in a new tab)">View Collateral &#8599;</a>';
    } else {
      collateralBtn = '<span class="collateral-btn is-disabled" aria-disabled="true" '+
        'title="Collateral not added yet">View Collateral</span>';
    }
    return '<article class="post-card">'+
      '<div class="post-card-top">'+
        '<span class="badge type-badge">'+icon+' '+escapeHtml(post.postType)+'</span>'+
        '<span class="badge status-badge status-'+slugStatus(post.status)+'">'+escapeHtml(post.status)+'</span>'+
      '</div>'+
      '<h4 class="post-title">'+escapeHtml(post.title)+'</h4>'+
      (post.description ? '<p class="post-desc">'+escapeHtml(post.description)+'</p>' : '')+
      '<div class="post-card-actions">'+
        collateralBtn +
      '</div>'+
    '</article>';
  }

  function renderDayCell(cell, info){
    var datePosts = posts.filter(function(p){ return p.date === cell.dateStr; });
    var visiblePosts = datePosts.filter(matchesFilters);
    var body;
    if(datePosts.length === 0){
      body = '<p class="empty-note-cell">No posts scheduled</p>';
    } else if(visiblePosts.length === 0){
      body = '<p class="empty-note-cell">No posts match filters</p>';
    } else {
      body = visiblePosts.map(renderPostCard).join("");
    }
    return '<div class="day-cell" style="--cat-color:'+info.colorHex+';--cat-soft:'+info.soft+'">'+
      '<div class="day-cell-top">'+
        '<span class="day-number">'+cell.day+'</span>'+
        '<span class="weekday-chip">'+info.name+' &middot; '+info.category+'</span>'+
      '</div>'+
      '<div class="day-posts">'+ body +'</div>'+
    '</div>';
  }

  function renderCalendar(){
    var month = findMonth(state.monthKey);
    el.monthHeading.textContent = month.label;
    var weeks = buildWeeks(month.year, month.month);
    var html = weeks.map(function(week){
      return '<div class="week-row">' + week.map(function(cell, idx){
        var info = DOW_INFO[idx];
        if(!cell){
          return '<div class="day-cell empty-cell" aria-hidden="true"></div>';
        }
        return renderDayCell(cell, info);
      }).join("") + '</div>';
    }).join("");
    el.calendarGrid.innerHTML = html || '<p class="empty-note">No business days to display.</p>';
  }

  function populateSelectOptions(){
    el.filterType.innerHTML = '<option value="">All types</option>' + TYPE_OPTIONS.map(function(t){ return '<option value="'+t+'">'+t+'</option>'; }).join("");
    el.filterStatus.innerHTML = '<option value="">All statuses</option>' + STATUS_OPTIONS.map(function(s){ return '<option value="'+s+'">'+s+'</option>'; }).join("");
  }

  function syncMonthSelects(){
    el.monthSelectHeader.value = state.monthKey;
    el.filterMonth.value = state.monthKey;
    el.prevMonthBtn.disabled = (state.monthKey === MONTHS[0].key);
    el.nextMonthBtn.disabled = (state.monthKey === MONTHS[MONTHS.length-1].key);
  }

  function renderAll(){
    renderCalendar();
  }

  /* =====================================================================
     STATUS TOAST
     ===================================================================== */
  var toastTimer = null;
  function announce(msg){
    el.statusMessage.textContent = msg;
    el.statusMessage.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.statusMessage.classList.remove("show"); }, 2400);
  }

  /* =====================================================================
     MONTH NAVIGATION
     ===================================================================== */
  function setMonth(key){
    var found = findMonth(key);
    state.monthKey = found.key;
    syncMonthSelects();
    renderAll();
  }
  function goToday(){
    var now = new Date();
    var key = now.getFullYear() + "-" + pad(now.getMonth()+1);
    var match = MONTHS.filter(function(m){ return m.key === key; })[0];
    setMonth(match ? match.key : MONTHS[0].key);
  }

  /* =====================================================================
     FILTER HANDLERS
     ===================================================================== */
  function applyFilterInputs(){
    state.filters.category = el.filterCategory.value;
    state.filters.type = el.filterType.value;
    state.filters.status = el.filterStatus.value;
    state.filters.search = el.searchInput.value.trim();
    renderCalendar();
  }
  function clearFilters(){
    el.filterCategory.value = "";
    el.filterType.value = "";
    el.filterStatus.value = "";
    el.searchInput.value = "";
    state.filters = {category:"",type:"",status:"",search:""};
    renderCalendar();
    announce("Filters cleared");
  }

  /* =====================================================================
     STRATEGY TOGGLE
     ===================================================================== */
  function toggleStrategy(){
    var collapsed = el.strategySection.classList.toggle("collapsed");
    el.strategyBtn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    el.strategyCollapseBtn.textContent = collapsed ? "Show" : "Hide";
    if(!collapsed){ el.strategySection.scrollIntoView({behavior:"smooth", block:"start"}); }
  }

  /* =====================================================================
     EVENT WIRING
     ===================================================================== */
  function wireEvents(){
    el.prevMonthBtn.addEventListener("click", function(){
      var idx = MONTHS.findIndex(function(m){ return m.key === state.monthKey; });
      if(idx > 0) setMonth(MONTHS[idx-1].key);
    });
    el.nextMonthBtn.addEventListener("click", function(){
      var idx = MONTHS.findIndex(function(m){ return m.key === state.monthKey; });
      if(idx < MONTHS.length-1) setMonth(MONTHS[idx+1].key);
    });
    el.todayBtn.addEventListener("click", goToday);
    el.monthSelectHeader.addEventListener("change", function(){ setMonth(this.value); });
    el.filterMonth.addEventListener("change", function(){ setMonth(this.value); });
    el.printBtn.addEventListener("click", function(){ window.print(); });
    el.strategyBtn.addEventListener("click", toggleStrategy);
    el.strategyCollapseBtn.addEventListener("click", toggleStrategy);

    el.filterCategory.addEventListener("change", applyFilterInputs);
    el.filterType.addEventListener("change", applyFilterInputs);
    el.filterStatus.addEventListener("change", applyFilterInputs);
    el.searchInput.addEventListener("input", applyFilterInputs);
    el.clearFiltersBtn.addEventListener("click", clearFilters);
  }

  /* =====================================================================
     INIT
     ===================================================================== */
  function init(){
    cacheEls();
    populateSelectOptions();
    renderWeekdayHeader();
    renderGlance();
    renderStrategy();
    syncMonthSelects();
    wireEvents();
    renderAll();
  }

  document.addEventListener("DOMContentLoaded", init);
})();
</script>
